name: CI

on:
  push:
    branches: [main, entrega-intermediaria]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore RotinaXP.API.sln

      - name: Build
        run: dotnet build RotinaXP.API.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RotinaXP.API.sln --no-build --verbosity normal

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'entrega-intermediaria')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet publish src/WebApi/RotinaXP.API.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotinaxp-api-publish
          path: ./publish
